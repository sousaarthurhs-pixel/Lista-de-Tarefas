<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="shortcut icon" href="https://res.cloudinary.com/i4fj6veu/image/upload/v1789754064/icon.png"
        type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        :root {
            --primary-color: #1f6feb;
            --background-color: #f4f6fa;
            --main-color: #ffffff;
            --text-color: #1b1f24;
            --subTitle-color: #57606a;
            --error-color: #b42318;
            --sucess-color: #1a7f37;

            --title-size: 28px;
            --subTitle-size: 20px;
            --text-size: 16px;

            --shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --trasition: ease-in-out 0.09s;
        }

        * {
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        body {
            font-family: "Montserrat", sans-serif;
            background-image: linear-gradient(to top left, var(--primary-color), #000);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            
        }

        main {
            background: var(--main-color);
            width: 60%;
            padding: 28px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            height: 90vh;
            overflow: auto;
            scrollbar-width: thin;

        }

        h1 {
            margin: 0 0 4px;
        }

        .title {
            font-size: var(--title-size);
        }

        .subTitle {
            margin: 30px 0;
            color: var(--subTitle-color);
            font-size: var(--subTitle-size);
        }

        .containerInput {
            display: flex;
            flex-direction: row;
            gap: 5px;
            margin-block: 30px;
        }

        input {
            width: 85%;
            padding: 11px 12px;
            border: 1px solid #d0d7de;
            border-radius: var(--radius);
            font-size: var(--text-size);
            outline: none;
            transition: var(--trasition);
        }

        input:hover {
            box-shadow: var(--shadow);
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 15%;
            font-weight: 600;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            font-size: var(--text-size);
            cursor: pointer;
            transition: var(--trasition);
        }

        button:hover {
            background-color: var(--primary-color);
            color: var(--main-color);
        }

        button:active {
            transform: scale(.95);
        }

        ul li {
            font-weight: 600;
            list-style: none;
            font-size: var(--text-size);
            padding: 12px 8px 12px 50px;
            user-select: none;
            cursor: pointer;
            position: relative;
            overflow-wrap: break-word;
        }

        ul li:hover {
            background-color: #cadfffee;
        }

        ul li::before {
            content: "";
            position: absolute;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background-image: url(https://res.cloudinary.com/i4fj6veu/image/upload/v1789756559/unchecked.png);
            background-size: cover;
            background-position: center;
            top: 10px;
            left: 8px;
        }

        ul li.checked {
            color: #555;
            text-decoration: line-through;
        }

        ul li.checked::before {
            background-image: url(https://res.cloudinary.com/i4fj6veu/image/upload/v1789756118/checked.png);
        }

        ul li span {
            position: absolute;
            right: 10px;
            top: 10px;
            width: 25px;
            height: 25px;
            font-size: 22px;
            color: #555;
            line-height: 25px;
            text-align: center;
        }

        ul li span:hover {
            background-color: var(--error-color);
            color: var(--background-color);
        }
    </style>
</head>

<body>
    <main>
        <h1 class="title">Lista de tarefa</h1>

        <div class="containerInput">
            <input type="text" placeholder="Digite uma tarefa..." id="inputText">
            <button onclick="addTask()">+ Adicionar</button>
        </div>

        <hr>

        <h1 class="subTitle">A Fazer</h1>
        <div class="containerList">
            <ul id="list-container">
            </ul>
        </div>
    </main>

    <script>
        const containerList = document.getElementById('list-container');
        const inputText = document.getElementById('inputText');
        let text = document.createElement("p");
        text.innerHTML = "Ainda não tem tarefas.";

        if (containerList.children.length === 0) {
            containerList.appendChild(text);
        }

        function addTask() {
            if (inputText.value === '') {
                alert("Nenhuma tarefa digitada!");
            } else {
                if (text !== "") {
                    text.innerHTML = "";
                }
                let li = document.createElement("li");
                li.innerHTML = inputText.value;
                containerList.appendChild(li);

                let span = document.createElement("span");
                span.innerHTML = "\u00d7";
                li.appendChild(span);
            }
            inputText.value = "";
        }

        containerList.addEventListener("click", function (e) {
            if (e.target.tagName === "LI") {
                e.target.classList.toggle("checked");
            } else if (e.target.tagName === "SPAN") {
                e.target.parentElement.remove();
                console.log(containerList.children.length);
                
                if (containerList.children.length === 1) {
                    text.innerHTML = "Ainda não tem tarefas.";
                    containerList.appendChild(text);
                }
            }
        }, false);

    </script>
</body>

</html>
